name: PR Check

on:
  pull_request:
    branches: [main, dev]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for better diff analysis
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting on changed files
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(js|ts|vue)$' | tr '\n' ' ')
          if [ -n "$CHANGED_FILES" ]; then
            echo "Linting changed files: $CHANGED_FILES"
            npx eslint $CHANGED_FILES
          else
            echo "No JS/TS/Vue files changed"
          fi

      - name: Check if tests exist for changed components
        run: |
          # Check if component changes have corresponding tests
          CHANGED_COMPONENTS=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'components/.*\.vue$')
          for component in $CHANGED_COMPONENTS; do
            component_name=$(basename "$component" .vue)
            test_file="tests/components/${component_name}.test.ts"
            if [ ! -f "$test_file" ]; then
              echo "Warning: No test file found for $component"
            fi
          done

      - name: Build size analysis
        run: |
          # Build the application and check size
          pnpm build

          # Get build size (approximate)
          if [ -d ".output/public" ]; then
            BUILD_SIZE=$(du -sh .output/public | cut -f1)
            echo "Build size: $BUILD_SIZE"
            echo "BUILD_SIZE=$BUILD_SIZE" >> $GITHUB_ENV
          fi

      - name: Comment PR with build info
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 PR Build Summary
              
              **Build Status**: ✅ Success
              **Build Size**: ${{ env.BUILD_SIZE }}
              
              ### Checks Completed:
              - ✅ Linting
              - ✅ Build verification
              - ✅ Component test coverage check
              
              *This comment was automatically generated by GitHub Actions*`
            })
